<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tally — Minimal Habit Tracker</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <meta name="theme-color" content="#0b0f19" />
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #131b2e;
      --surface-hover: #1c2742;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #1e293b;
      --accent: #7c83ff;
      --accent-glow: rgba(124, 131, 255, 0.25);
    }

    [data-mode="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-hover: #f1f5f9;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 28px 16px 100px;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
    }

    /* Top Header & Theme Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 18px;
      gap: 12px;
    }

    .date-label {
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 4px;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .theme-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .color-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.15s ease;
    }

    .color-dot.active {
      transform: scale(1.2);
      border-color: var(--text);
    }

    .mode-btn {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: 0.95rem;
      padding-left: 4px;
    }

    /* Progress Bar */
    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--surface);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
      transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Action Pill Buttons */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }

    .pill-btn {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 8px 13px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pill-btn:hover {
      color: var(--text);
      border-color: var(--accent);
      background: var(--surface-hover);
    }

    /* Empty State */
    .empty-state {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
      padding: 28px 20px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 16px;
      text-align: center;
      margin-bottom: 20px;
    }

    /* Habit Cards */
    .habit-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .habit-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      transition: transform 0.15s ease, border-color 0.2s ease;
    }

    .habit-card:hover {
      border-color: var(--accent);
    }

    .habit-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .habit-title-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .habit-name {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .habit-badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 99px;
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .badge.streak {
      color: var(--accent);
      border-color: var(--accent);
      font-weight: 600;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px;
    }

    .delete-btn:hover {
      color: #ef4444;
    }

    /* 7-Day Circles */
    .week-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .day-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .day-name {
      font-size: 0.7rem;
      color: var(--muted);
    }

    .day-circle {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.75rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .day-circle.done {
      background: var(--accent);
      border-color: var(--accent);
      color: #0b0f19;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* Floating Bottom Add Button */
    .bottom-bar {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      padding: 0 16px;
      pointer-events: none;
    }

    .primary-btn {
      pointer-events: auto;
      width: 100%;
      max-width: 480px;
      background: var(--accent);
      color: #0b0f19;
      font-weight: 700;
      font-size: 1rem;
      padding: 15px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 20px var(--accent-glow);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .primary-btn:active {
      transform: scale(0.98);
    }

    /* Add Habit Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      width: 100%;
      max-width: 420px;
      padding: 22px;
    }

    .modal h2 {
      font-size: 1.25rem;
      margin-bottom: 16px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="top-bar">
      <div>
        <div class="date-label" id="dateDisplay"></div>
        <h1 id="statusHeading">Nothing tracked yet</h1>
      </div>

      <!-- Color & Light/Dark Switcher -->
      <div class="theme-controls" title="Customize Accent & Theme">
        <div class="color-dot" style="background:#7c83ff" data-color="#7c83ff"></div>
        <div class="color-dot" style="background:#10b981" data-color="#10b981"></div>
        <div class="color-dot" style="background:#f43f5e" data-color="#f43f5e"></div>
        <div class="color-dot" style="background:#f59e0b" data-color="#f59e0b"></div>
        <div class="color-dot" style="background:#06b6d4" data-color="#06b6d4"></div>
        <button class="mode-btn" id="modeToggle" title="Toggle Light/Dark">🌙</button>
      </div>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progressBar"></div>
    </div>

    <div class="toolbar">
      <button class="pill-btn" id="installBtn">Install app</button>
      <button class="pill-btn" id="notifyPermBtn">🔔 Enable reminders</button>
      <button class="pill-btn" id="backupBtn">Back up data</button>
      <button class="pill-btn" id="restoreBtn">Restore backup</button>
      <input type="file" id="restoreInput" accept=".json" style="display:none" />
    </div>

    <div id="emptyState" class="empty-state">
      Add your first habit. Keep it small enough to do on your worst day.
    </div>

    <div class="habit-list" id="habitList"></div>
  </div>

  <div class="bottom-bar">
    <button class="primary-btn" id="openModalBtn">Add habit</button>
  </div>

  <!-- Modal for adding a habit with Auto Check-In and Reminder options -->
  <div class="modal-backdrop" id="habitModal">
    <div class="modal">
      <h2>New Habit</h2>
      <div class="field">
        <label>Habit Name</label>
        <input type="text" id="habitNameInput" placeholder="e.g., Drink 2L of water, Read 10 pages" />
      </div>
      <div class="field">
        <label>Check-In Mode (Manual or Automatic)</label>
        <select id="habitAutoMode">
          <option value="on_open">Auto check-in when I open Tally each day</option>
          <option value="on_time">Auto check-in at reminder time</option>
          <option value="manual">Manual tap only</option>
        </select>
      </div>
      <div class="field">
        <label>Daily Reminder Time (Optional)</label>
        <input type="time" id="habitReminderTime" />
      </div>
      <div class="modal-actions">
        <button class="pill-btn" id="closeModalBtn">Cancel</button>
        <button class="pill-btn" id="saveHabitBtn" style="background:var(--accent);color:#0b0f19;font-weight:700;">Save habit</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "tally_habits_v2";
    const THEME_KEY = "tally_theme_v2";

    let habits = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    let theme = JSON.parse(localStorage.getItem(THEME_KEY) || '{"accent":"#7c83ff","mode":"dark"}');

    function todayISO(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() - offsetDays);
      return d.toISOString().split("T")[0];
    }

    // 1. Apply Saved Color & Light/Dark Mode
    function applyTheme() {
      document.documentElement.style.setProperty("--accent", theme.accent);
      document.documentElement.style.setProperty("--accent-glow", theme.accent + "44");
      document.documentElement.setAttribute("data-mode", theme.mode);
      document.getElementById("modeToggle").textContent = theme.mode === "dark" ? "🌙" : "☀️";

      document.querySelectorAll(".color-dot").forEach(dot => {
        dot.classList.toggle("active", dot.dataset.color === theme.accent);
      });
      localStorage.setItem(THEME_KEY, JSON.stringify(theme));
    }

    document.querySelectorAll(".color-dot").forEach(dot => {
      dot.addEventListener("click", () => {
        theme.accent = dot.dataset.color;
        applyTheme();
      });
    });

    document.getElementById("modeToggle").addEventListener("click", () => {
      theme.mode = theme.mode === "dark" ? "light" : "dark";
      applyTheme();
    });

    // 2. Automatic Check-In Engine
    function runAutoCheckIns() {
      const today = todayISO(0);
      const now = new Date();
      const currentHHMM = now.toTimeString().slice(0, 5);
      let updated = false;

      habits.forEach(h => {
        if (!h.history) h.history = {};
        // Auto check-in on app open
        if (h.autoMode === "on_open" && !h.history[today]) {
          h.history[today] = true;
          updated = true;
        }
        // Auto check-in once scheduled time is reached
        if (h.autoMode === "on_time" && h.reminderTime && currentHHMM >= h.reminderTime && !h.history[today]) {
          h.history[today] = true;
          updated = true;
        }
      });

      if (updated) {
        saveHabits();
        render();
      }
    }

    // 3. Daily Reminder Notification Engine
    function checkReminders() {
      const today = todayISO(0);
      const now = new Date();
      const currentHHMM = now.toTimeString().slice(0, 5);

      habits.forEach(h => {
        if (h.reminderTime && h.reminderTime === currentHHMM && h.lastNotifiedDate !== today) {
          h.lastNotifiedDate = today;
          if (h.autoMode === "on_time") {
            h.history[today] = true;
          }
          saveHabits();
          render();

          if ("Notification" in window && Notification.permission === "granted") {
            new Notification("Tally Habit Reminder", {
              body: h.autoMode === "on_time"
                ? `✅ "${h.name}" was automatically checked in for today!`
                : `⏰ Time for your habit: "${h.name}"`,
              icon: "icon-192.png"
            });
          }
        }
      });
    }

    document.getElementById("notifyPermBtn").addEventListener("click", async () => {
      if (!("Notification" in window)) {
        alert("Notifications are not supported in this browser.");
        return;
      }
      const perm = await Notification.requestPermission();
      if (perm === "granted") {
        document.getElementById("notifyPermBtn").textContent = "🔔 Reminders active";
        new Notification("Tally Reminders Enabled", { body: "You'll be notified at your scheduled habit times." });
      }
    });

    function calculateStreak(history) {
      let streak = 0;
      for (let i = 0; i < 365; i++) {
        const d = todayISO(i);
        if (history && history[d]) {
          streak++;
        } else if (i > 0) {
          break;
        }
      }
      return streak;
    }

    function saveHabits() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
    }

    function render() {
      const now = new Date();
      document.getElementById("dateDisplay").textContent = now.toLocaleDateString("en-US", {
        weekday: "long",
        month: "long",
        day: "numeric"
      });

      const listEl = document.getElementById("habitList");
      const emptyEl = document.getElementById("emptyState");
      const headingEl = document.getElementById("statusHeading");
      const progressEl = document.getElementById("progressBar");

      listEl.innerHTML = "";
      const today = todayISO(0);

      if (habits.length === 0) {
        emptyEl.style.display = "block";
        headingEl.textContent = "Nothing tracked yet";
        progressEl.style.width = "0%";
        return;
      }

      emptyEl.style.display = "none";
      const doneToday = habits.filter(h => h.history && h.history[today]).length;
      const pct = Math.round((doneToday / habits.length) * 100);
      headingEl.textContent = `${doneToday} of ${habits.length} done today`;
      progressEl.style.width = `${pct}%`;

      habits.forEach((h, index) => {
        const card = document.createElement("div");
        card.className = "habit-card";

        const streak = calculateStreak(h.history);
        const modeLabel =
          h.autoMode === "on_open" ? "⚡ Auto on open" :
          h.autoMode === "on_time" ? "⚡ Auto at time" : "🖐️ Manual";

        let weekHTML = "";
        for (let i = 6; i >= 0; i--) {
          const dateKey = todayISO(i);
          const dObj = new Date();
          dObj.setDate(dObj.getDate() - i);
          const dayShort = dObj.toLocaleDateString("en-US", { weekday: "narrow" });
          const dayNum = dObj.getDate();
          const isDone = h.history && h.history[dateKey];

          weekHTML += `
            <div class="day-col">
              <span class="day-name">${dayShort}</span>
              <button class="day-circle ${isDone ? "done" : ""}" data-idx="${index}" data-date="${dateKey}">
                ${isDone ? "✓" : dayNum}
              </button>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="habit-header">
            <div class="habit-title-group">
              <div class="habit-name">${h.name}</div>
              <div class="habit-badges">
                <span class="badge streak">🔥 ${streak} day streak</span>
                <span class="badge">${modeLabel}</span>
                ${h.reminderTime ? `<span class="badge">⏰ ${h.reminderTime}</span>` : ""}
              </div>
            </div>
            <button class="delete-btn" data-del="${index}" title="Delete habit">✕</button>
          </div>
          <div class="week-row">${weekHTML}</div>
        `;
        listEl.appendChild(card);
      });

      // Toggle any day circle (if user wants to override or fix past days)
      document.querySelectorAll(".day-circle").forEach(btn => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.dataset.idx);
          const dt = btn.dataset.date;
          habits[idx].history[dt] = !habits[idx].history[dt];
          saveHabits();
          render();
        });
      });

      document.querySelectorAll(".delete-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.dataset.del);
          habits.splice(idx, 1);
          saveHabits();
          render();
        });
      });
    }

    // Modal handlers
    const modal = document.getElementById("habitModal");
    document.getElementById("openModalBtn").addEventListener("click", () => {
      modal.classList.add("open");
      document.getElementById("habitNameInput").focus();
    });
    document.getElementById("closeModalBtn").addEventListener("click", () => {
      modal.classList.remove("open");
    });

    document.getElementById("saveHabitBtn").addEventListener("click", () => {
      const name = document.getElementById("habitNameInput").value.trim();
      const autoMode = document.getElementById("habitAutoMode").value;
      const reminderTime = document.getElementById("habitReminderTime").value;
      if (!name) return;

      habits.push({
        name,
        autoMode,
        reminderTime,
        history: {},
        lastNotifiedDate: null
      });

      document.getElementById("habitNameInput").value = "";
      document.getElementById("habitReminderTime").value = "";
      modal.classList.remove("open");

      saveHabits();
      runAutoCheckIns();
      render();
    });

    // Backup & Restore
    document.getElementById("backupBtn").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(habits, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `tally-backup-${todayISO(0)}.json`;
      a.click();
    });

    document.getElementById("restoreBtn").addEventListener("click", () => {
      document.getElementById("restoreInput").click();
    });

    document.getElementById("restoreInput").addEventListener("change", e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          habits = JSON.parse(ev.target.result);
          saveHabits();
          render();
        } catch (err) {
          alert("Invalid backup file.");
        }
      };
      reader.readAsText(file);
    });

    // PWA Install Prompt
    let deferredPrompt;
    window.addEventListener("beforeinstallprompt", e => {
      e.preventDefault();
      deferredPrompt = e;
    });
    document.getElementById("installBtn").addEventListener("click", async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
      } else {
        alert("To install: click the Install icon in your browser's address bar or use 'Add to Home Screen' on mobile.");
      }
    });

    // Service Worker Registration
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }

    // Initialize App
    applyTheme();
    runAutoCheckIns();
    render();
    setInterval(() => {
      runAutoCheckIns();
      checkReminders();
    }, 20000);
  </script>
</body>
</html>
