<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tally — Minimal Habit Tracker</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <meta name="theme-color" content="#070913" />
  <style>
    :root {
      --bg: #070913;
      --bg-secondary: #0f1428;
      --glass: rgba(19, 27, 46, 0.62);
      --glass-strong: rgba(24, 34, 58, 0.85);
      --glass-border: rgba(255, 255, 255, 0.09);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #7c83ff;
      --accent-2: #c084fc;
      --accent-glow: rgba(124, 131, 255, 0.35);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    [data-mode="light"] {
      --bg: #eef2ff;
      --bg-secondary: #e0e7ff;
      --glass: rgba(255, 255, 255, 0.72);
      --glass-strong: rgba(255, 255, 255, 0.92);
      --glass-border: rgba(15, 23, 42, 0.08);
      --text: #0f172a;
      --muted: #64748b;
      --shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      display: flex;
      justify-content: center;
      padding: 32px 16px 120px;
      transition: background-color 0.35s ease, color 0.35s ease;
    }

    /* Ambient Animated Background Environment */
    .ambient-canvas {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background: radial-gradient(circle at 50% 0%, var(--bg-secondary), var(--bg) 75%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      opacity: 0.42;
      animation: floatOrb 16s infinite alternate ease-in-out;
    }

    .orb-1 {
      width: 360px;
      height: 360px;
      background: var(--accent);
      top: -110px;
      left: -80px;
    }

    .orb-2 {
      width: 320px;
      height: 320px;
      background: var(--accent-2);
      bottom: 8%;
      right: -90px;
      animation-delay: -6s;
    }

    .orb-3 {
      width: 240px;
      height: 240px;
      background: var(--accent);
      top: 45%;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0.2;
      animation-delay: -11s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(35px, 45px) scale(1.12); }
    }

    .app-shell {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Glass Card Base */
    .glass-panel {
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    /* Top Environment & Theme Bar */
    .env-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-radius: 999px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }

    .brand-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    .theme-Cluster {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .swatch {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .swatch.active {
      transform: scale(1.22);
      border-color: var(--text);
    }

    .custom-color-input {
      width: 22px;
      height: 22px;
      border: none;
      padding: 0;
      border-radius: 50%;
      cursor: pointer;
      background: transparent;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 0.95rem;
      margin-left: 4px;
    }

    /* Hero Dashboard Card */
    .hero-card {
      padding: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .hero-date {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .hero-title {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }

    .hero-sub {
      font-size: 0.88rem;
      color: var(--muted);
    }

    /* Circular SVG Progress Ring */
    .ring-wrap {
      position: relative;
      width: 78px;
      height: 78px;
      flex-shrink: 0;
    }

    .ring-svg {
      transform: rotate(-90deg);
      width: 78px;
      height: 78px;
    }

    .ring-bg {
      fill: none;
      stroke: var(--glass-border);
      stroke-width: 7;
    }

    .ring-meter {
      fill: none;
      stroke: var(--accent);
      stroke-width: 7;
      stroke-linecap: round;
      stroke-dasharray: 201;
      stroke-dashoffset: 201;
      transition: stroke-dashoffset 0.5s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.3s ease;
    }

    .ring-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: 800;
    }

    /* Quick Stats Row */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat-box {
      padding: 14px;
      border-radius: 18px;
      text-align: center;
    }

    .stat-val {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text);
    }

    .stat-lbl {
      font-size: 0.74rem;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Action Pill Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill-btn {
      background: var(--glass);
      backdrop-filter: blur(12px);
      color: var(--muted);
      border: 1px solid var(--glass-border);
      padding: 9px 14px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pill-btn:hover {
      color: var(--text);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    /* Empty State */
    .empty-state {
      padding: 36px 24px;
      text-align: center;
      color: var(--muted);
      line-height: 1.6;
    }

    .empty-icon {
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    /* Habit List & Cards */
    .habit-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .habit-card {
      padding: 18px;
      transition: transform 0.2s ease, border-color 0.25s ease;
    }

    .habit-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .habit-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .habit-name {
      font-size: 1.08rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--muted);
    }

    .badge.accent {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-glow);
    }

    .del-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 4px 8px;
      border-radius: 8px;
    }

    .del-btn:hover {
      color: #f43f5e;
      background: rgba(244, 63, 94, 0.12);
    }

    /* 7-Day Interactive Strip */
    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--glass-border);
    }

    .day-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .day-lbl {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
    }

    .day-btn {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 1.5px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .day-btn:hover {
      border-color: var(--accent);
    }

    .day-btn.done {
      background: var(--accent);
      border-color: var(--accent);
      color: #070913;
      box-shadow: 0 4px 14px var(--accent-glow);
      transform: scale(1.04);
    }

    /* Floating Bottom Dock */
    .dock {
      position: fixed;
      bottom: 22px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      padding: 0 16px;
      z-index: 20;
      pointer-events: none;
    }

    .add-btn {
      pointer-events: auto;
      width: 100%;
      max-width: 540px;
      padding: 16px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #070913;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 28px var(--accent-glow);
      transition: transform 0.15s ease, filter 0.2s ease;
    }

    .add-btn:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    /* Modal Dialog */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 6, 16, 0.72);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      background: var(--glass-strong);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .modal-card h2 {
      font-size: 1.3rem;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.22);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    [data-mode="light"] .form-group input,
    [data-mode="light"] .form-group select {
      background: rgba(15, 23, 42, 0.05);
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <!-- Ambient Floating Glow Environment -->
  <div class="ambient-canvas">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="app-shell">
    <!-- Top Environment & Color Bar -->
    <header class="glass-panel env-bar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span>Tally</span>
      </div>
      <div class="theme-Cluster">
        <div class="swatch" style="background:#7c83ff" data-accent="#7c83ff" data-accent2="#c084fc"></div>
        <div class="swatch" style="background:#10b981" data-accent="#10b981" data-accent2="#34d399"></div>
        <div class="swatch" style="background:#f43f5e" data-accent="#f43f5e" data-accent2="#fb7185"></div>
        <div class="swatch" style="background:#f59e0b" data-accent="#f59e0b" data-accent2="#facc15"></div>
        <div class="swatch" style="background:#06b6d4" data-accent="#06b6d4" data-accent2="#38bdf8"></div>
        <input type="color" id="customColorPicker" class="custom-color-input" title="Pick any custom color" value="#7c83ff" />
        <button class="icon-btn" id="modeBtn" title="Switch Dark / Light environment">🌙</button>
      </div>
    </header>

    <!-- Hero Progress Card -->
    <section class="glass-panel hero-card">
      <div>
        <div class="hero-date" id="dateText">SUNDAY, NOVEMBER 8</div>
        <h1 class="hero-title" id="heroHeading">Nothing tracked yet</h1>
        <p class="hero-sub" id="heroSub">Auto check-ins & reminders are ready.</p>
      </div>
      <div class="ring-wrap">
        <svg class="ring-svg">
          <circle class="ring-bg" cx="39" cy="39" r="32"></circle>
          <circle class="ring-meter" id="ringMeter" cx="39" cy="39" r="32"></circle>
        </svg>
        <div class="ring-label" id="ringPercent">0%</div>
      </div>
    </section>

    <!-- Environment Stats Strip -->
    <section class="stats-grid">
      <div class="glass-panel stat-box">
        <div class="stat-val" id="statTotal">0</div>
        <div class="stat-lbl">Active Habits</div>
      </div>
      <div class="glass-panel stat-box">
        <div class="stat-val" id="statBestStreak">0 🔥</div>
        <div class="stat-lbl">Best Streak</div>
      </div>
      <div class="glass-panel stat-box">
        <div class="stat-val" id="statAutoCount">0 ⚡</div>
        <div class="stat-lbl">Auto-Tracked</div>
      </div>
    </section>

    <!-- Action Pill Bar -->
    <div class="toolbar">
      <button class="pill-btn" id="installBtn">📲 Install app</button>
      <button class="pill-btn" id="enableRemindersBtn">🔔 Enable reminders</button>
      <button class="pill-btn" id="backupBtn">💾 Back up data</button>
      <button class="pill-btn" id="restoreBtn">📂 Restore backup</button>
      <input type="file" id="restoreFile" accept=".json" style="display:none" />
    </div>

    <!-- Empty State -->
    <div id="emptyCard" class="glass-panel empty-state">
      <div class="empty-icon">✨</div>
      <strong>Add your first habit.</strong><br />
      Keep it small enough to do on your worst day—or set it to check in automatically.
    </div>

    <!-- Habit List -->
    <div class="habit-list" id="habitContainer"></div>
  </div>

  <!-- Floating Bottom Action Button -->
  <div class="dock">
    <button class="add-btn" id="openModalBtn">+ Add Habit</button>
  </div>

  <!-- New Habit Modal -->
  <div class="modal-overlay" id="habitModal">
    <div class="modal-card">
      <h2>Create Habit</h2>
      <div class="form-group">
        <label>Habit Name</label>
        <input type="text" id="habitName" placeholder="e.g., Morning stretch, Drink water, Code 30m" />
      </div>
      <div class="form-group">
        <label>Check-In Behavior (Automatic vs. Manual)</label>
        <select id="habitAutoMode">
          <option value="on_open">⚡ Auto check-in as soon as I open Tally</option>
          <option value="on_time">⏰ Auto check-in at my reminder time</option>
          <option value="manual">🖐️ Manual check-in only</option>
        </select>
      </div>
      <div class="form-group">
        <label>Daily Reminder Notification Time (Optional)</label>
        <input type="time" id="habitReminder" />
      </div>
      <div class="modal-footer">
        <button class="pill-btn" id="cancelModalBtn">Cancel</button>
        <button class="pill-btn" id="saveHabitBtn" style="background:var(--accent);color:#070913;border:none;font-weight:800;">Save Habit</button>
      </div>
    </div>
  </div>

  <script>
    const HABITS_KEY = "tally_habits_v3";
    const ENV_KEY = "tally_env_v3";

    // Migrate v2 habits automatically if present
    let habits = JSON.parse(localStorage.getItem(HABITS_KEY) || localStorage.getItem("tally_habits_v2") || "[]");
    let env = JSON.parse(localStorage.getItem(ENV_KEY) || '{"accent":"#7c83ff","accent2":"#c084fc","mode":"dark"}');

    function getISO(daysAgo = 0) {
      const d = new Date();
      d.setDate(d.getDate() - daysAgo);
      return d.toISOString().split("T")[0];
    }

    function applyEnvironment() {
      document.documentElement.style.setProperty("--accent", env.accent);
      document.documentElement.style.setProperty("--accent-2", env.accent2 || env.accent);
      document.documentElement.style.setProperty("--accent-glow", env.accent + "55");
      document.documentElement.setAttribute("data-mode", env.mode);
      document.getElementById("modeBtn").textContent = env.mode === "dark" ? "🌙" : "☀️";
      document.getElementById("customColorPicker").value = env.accent;

      document.querySelectorAll(".swatch").forEach(s => {
        s.classList.toggle("active", s.dataset.accent.toLowerCase() === env.accent.toLowerCase());
      });
      localStorage.setItem(ENV_KEY, JSON.stringify(env));
    }

    document.querySelectorAll(".swatch").forEach(s => {
      s.addEventListener("click", () => {
        env.accent = s.dataset.accent;
        env.accent2 = s.dataset.accent2;
        applyEnvironment();
      });
    });

    document.getElementById("customColorPicker").addEventListener("input", e => {
      env.accent = e.target.value;
      env.accent2 = e.target.value;
      applyEnvironment();
    });

    document.getElementById("modeBtn").addEventListener("click", () => {
      env.mode = env.mode === "dark" ? "light" : "dark";
      applyEnvironment();
    });

    function save() {
      localStorage.setItem(HABITS_KEY, JSON.stringify(habits));
    }

    function runAutoCheckIns() {
      const today = getISO(0);
      const nowTime = new Date().toTimeString().slice(0, 5);
      let changed = false;

      habits.forEach(h => {
        if (!h.history) h.history = {};
        if (h.autoMode === "on_open" && !h.history[today]) {
          h.history[today] = true;
          changed = true;
        }
        if (h.autoMode === "on_time" && h.reminderTime && nowTime >= h.reminderTime && !h.history[today]) {
          h.history[today] = true;
          changed = true;
        }
      });

      if (changed) {
        save();
        render();
      }
    }

    function checkScheduledReminders() {
      const today = getISO(0);
      const nowTime = new Date().toTimeString().slice(0, 5);

      habits.forEach(h => {
        if (h.reminderTime && h.reminderTime === nowTime && h.lastNotified !== today) {
          h.lastNotified = today;
          if (h.autoMode === "on_time") {
            h.history[today] = true;
          }
          save();
          render();

          if ("Notification" in window && Notification.permission === "granted") {
            new Notification("Tally Reminder", {
              body: h.autoMode === "on_time"
                ? `✅ "${h.name}" was automatically checked off!`
                : `⏰ Time for "${h.name}"`,
              icon: "icon-192.png"
            });
          }
        }
      });
    }

    document.getElementById("enableRemindersBtn").addEventListener("click", async () => {
      if (!("Notification" in window)) {
        alert("Notifications are not supported in this browser.");
        return;
      }
      const perm = await Notification.requestPermission();
      if (perm === "granted") {
        document.getElementById("enableRemindersBtn").textContent = "🔔 Reminders On";
        new Notification("Tally Reminders Active", {
          body: "We'll notify you at your scheduled habit times."
        });
      }
    });

    function calcStreak(history) {
      let count = 0;
      for (let i = 0; i < 365; i++) {
        const d = getISO(i);
        if (history && history[d]) count++;
        else if (i > 0) break;
      }
      return count;
    }

    function render() {
      const now = new Date();
      document.getElementById("dateText").textContent = now.toLocaleDateString("en-US", {
        weekday: "long",
        month: "long",
        day: "numeric"
      }).toUpperCase();

      const today = getISO(0);
      const list = document.getElementById("habitContainer");
      const empty = document.getElementById("emptyCard");
      list.innerHTML = "";

      const total = habits.length;
      const doneCount = habits.filter(h => h.history && h.history[today]).length;
      const pct = total === 0 ? 0 : Math.round((doneCount / total) * 100);

      // Update SVG Progress Ring
      const circumference = 201;
      const offset = circumference - (pct / 100) * circumference;
      document.getElementById("ringMeter").style.strokeDashoffset = offset;
      document.getElementById("ringPercent").textContent = `${pct}%`;

      // Update Top Stats
      let bestStreak = 0;
      let autoCount = 0;
      habits.forEach(h => {
        const s = calcStreak(h.history);
        if (s > bestStreak) bestStreak = s;
        if (h.autoMode !== "manual") autoCount++;
      });

      document.getElementById("statTotal").textContent = total;
      document.getElementById("statBestStreak").textContent = `${bestStreak} 🔥`;
      document.getElementById("statAutoCount").textContent = `${autoCount} ⚡`;

      if (total === 0) {
        empty.style.display = "block";
        document.getElementById("heroHeading").textContent = "Nothing tracked yet";
        document.getElementById("heroSub").textContent = "Start small and watch your streak grow.";
        return;
      }

      empty.style.display = "none";
      document.getElementById("heroHeading").textContent =
        doneCount === total ? "All habits complete! 🎉" : `${doneCount} of ${total} completed`;
      document.getElementById("heroSub").textContent =
        doneCount === total ? "Awesome consistency today." : "Tap any day square to adjust or override.";

      habits.forEach((h, idx) => {
        const card = document.createElement("div");
        card.className = "glass-panel habit-card";
        const streak = calcStreak(h.history);
        const modeTag =
          h.autoMode === "on_open" ? "⚡ Auto on open" :
          h.autoMode === "on_time" ? "⏰ Auto at time" : "🖐️ Manual";

        let daysHTML = "";
        for (let i = 6; i >= 0; i--) {
          const dKey = getISO(i);
          const dObj = new Date();
          dObj.setDate(dObj.getDate() - i);
          const dName = dObj.toLocaleDateString("en-US", { weekday: "short" }).slice(0, 2);
          const dNum = dObj.getDate();
          const done = h.history && h.history[dKey];

          daysHTML += `
            <div class="day-cell">
              <span class="day-lbl">${dName}</span>
              <button class="day-btn ${done ? "done" : ""}" data-idx="${idx}" data-date="${dKey}">
                ${done ? "✓" : dNum}
              </button>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="habit-top">
            <div>
              <div class="habit-name">${h.name}</div>
              <div class="badge-row">
                <span class="badge accent">🔥 ${streak} day streak</span>
                <span class="badge">${modeTag}</span>
                ${h.reminderTime ? `<span class="badge">🔔 ${h.reminderTime}</span>` : ""}
              </div>
            </div>
            <button class="del-btn" data-del="${idx}" title="Remove habit">✕</button>
          </div>
          <div class="week-grid">${daysHTML}</div>
        `;
        list.appendChild(card);
      });

      document.querySelectorAll(".day-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const i = Number(btn.dataset.idx);
          const dt = btn.dataset.date;
          habits[i].history[dt] = !habits[i].history[dt];
          save();
          render();
        });
      });

      document.querySelectorAll(".del-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          habits.splice(Number(btn.dataset.del), 1);
          save();
          render();
        });
      });
    }

    // Modal Controls
    const modal = document.getElementById("habitModal");
    document.getElementById("openModalBtn").addEventListener("click", () => {
      modal.classList.add("open");
      document.getElementById("habitName").focus();
    });
    document.getElementById("cancelModalBtn").addEventListener("click", () => {
      modal.classList.remove("open");
    });

    document.getElementById("saveHabitBtn").addEventListener("click", () => {
      const name = document.getElementById("habitName").value.trim();
      const autoMode = document.getElementById("habitAutoMode").value;
      const reminderTime = document.getElementById("habitReminder").value;
      if (!name) return;

      habits.push({ name, autoMode, reminderTime, history: {}, lastNotified: null });
      document.getElementById("habitName").value = "";
      document.getElementById("habitReminder").value = "";
      modal.classList.remove("open");

      save();
      runAutoCheckIns();
      render();
    });

    // Backup & Restore
    document.getElementById("backupBtn").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(habits, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `tally-backup-${getISO(0)}.json`;
      a.click();
    });

    document.getElementById("restoreBtn").addEventListener("click", () => {
      document.getElementById("restoreFile").click();
    });

    document.getElementById("restoreFile").addEventListener("change", e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          habits = JSON.parse(ev.target.result);
          save();
          render();
        } catch {
          alert("Invalid backup file.");
        }
      };
      reader.readAsText(file);
    });

    // PWA Install
    let deferredPrompt;
    window.addEventListener("beforeinstallprompt", e => {
      e.preventDefault();
      deferredPrompt = e;
    });
    document.getElementById("installBtn").addEventListener("click", () => {
      if (deferredPrompt) deferredPrompt.prompt();
      else alert("Click the Install icon in your browser address bar to install Tally.");
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }

    applyEnvironment();
    runAutoCheckIns();
    render();
    setInterval(() => {
      runAutoCheckIns();
      checkScheduledReminders();
    }, 20000);
  </script>
</body>
</html>
